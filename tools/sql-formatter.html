<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Formatter — Free, No Login | PixelAbs Tools</title>
  <meta name="description" content="Turn a messy one-line SQL query into clean, readable, indented code. Nothing leaves your browser.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../assets/img/icon-192.png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="inner">
      <a class="brand" href="../index.html">
        <img src="../assets/img/icon-192.png" alt="PixelAbs Tools logo">
        <span>PixelAbs&nbsp;Tools</span>
      </a>
      <div class="header-actions">
        <span class="privacy-pill"><span class="dot"></span><span class="label">100% local processing</span></span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark / light theme" aria-label="Toggle theme">◐</button>
      </div>
    </div>
  </header>

  <main class="tool-page">
    <div class="container">

      <div class="tool-head">
        <a class="back" href="../index.html">← All tools</a>
        <h1><span class="icon">🗄️</span> SQL Formatter</h1>
        <p class="desc">Turn a messy one-line SQL query into clean, readable, indented code. Nothing leaves your browser.</p>
      </div>

      <div class="panel">
        <h2>Your SQL</h2>
        <div class="option">
          <label class="field">Paste any SELECT / INSERT / UPDATE / DELETE query</label>
          <textarea id="in" style="min-height:150px; font-family:var(--mono); font-size:.85rem;" placeholder="select id,name,email from users where status='active' and created_at>'2026-01-01' order by name limit 10"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="fmt-btn">Format SQL</button>
          <button class="btn btn-secondary" id="min-btn">Minify</button>
        </div>
      </div>

      <div class="panel hidden" id="out-panel">
        <h2>Result</h2>
        <textarea id="out" readonly style="min-height:200px; font-family:var(--mono); font-size:.85rem;"></textarea>
        <div class="btn-row mt">
          <button class="btn btn-primary" id="copy-btn">Copy</button>
          <button class="btn btn-secondary" id="dl-btn">Download .sql</button>
        </div>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <div class="footer-slim">
        <div class="footer-brand">
          <a class="footer-logo" href="../index.html" aria-label="PixelAbs Tools — home"><span class="footer-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></span>PixelAbs Tools</a>
          <p class="footer-tagline">Runs entirely in your browser — nothing is ever uploaded.</p>
        </div>
        <div class="links">
          <a href="../index.html">All tools</a>
          <a href="https://github.com/Vishalkumar-acad/pixelabs-tools" target="_blank" rel="noopener">GitHub</a>
          <span>© <span id="year"></span></span>
        </div>
      </div>
      <div class="footer-bottom"><span class="saved-note" id="savings-note"></span></div>
    </div>
  </footer>

  <div id="toast-root"></div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/tools/sql-formatter.js"></script>
</body>
</html>
