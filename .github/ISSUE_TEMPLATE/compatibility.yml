name: Browser / device compatibility
description: Something doesn't work in a particular browser, OS, or device.
title: '[Compatibility]: '
labels:
- compatibility
body:
- type: dropdown
  id: tool
  attributes:
    label: Which tool is this about?
    options:
    - Image Compressor
    - Image Converter
    - Image Resizer
    - Image Metadata (EXIF)
    - PDF Merge
    - PDF Split & Extract
    - PDF Compressor
    - Images to PDF
    - PDF to Images
    - JSON Formatter
    - Text Case Converter
    - Base64 Encoder/Decoder
    - QR Code Generator
    - CSV <-> JSON
    - XML <-> JSON
    - SQL Formatter
    - cURL Converter
    - Cron Helper
    - Redirect Config Generator
    - Gradient Generator
    - Aspect Ratio Calculator
    - Font Pairing
    - Pomodoro Timer
    - Data Unit Converter
    - Timezone Converter
    - Audio Trimmer
    - Audio Speed & Pitch
    - Audio Joiner
    - Video to GIF
    - File Type Checker
    - File Hash Comparer
    - Site-wide / not tool-specific
  validations:
    required: true
- type: input
  id: browser
  attributes:
    label: Browser & version
    placeholder: e.g. Firefox 131
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: Operating system / device
    placeholder: e.g. Windows 11, iPhone 15, Android 14
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What goes wrong?
  validations:
    required: true
- type: input
  id: works-elsewhere
  attributes:
    label: Does it work in another browser? (optional)
