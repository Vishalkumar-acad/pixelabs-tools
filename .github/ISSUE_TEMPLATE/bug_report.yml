name: Bug report
description: Something on the site isn't working as expected.
title: '[Bug]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: '> PixelAbs Tools runs in your browser and never uploads your files. Please **do not** paste private file contents, personal data, or anything confidential here.'
- type: dropdown
  id: tool
  attributes:
    label: Which tool is this about?
    options:
    - Image Compressor
    - Image Converter
    - Image Resizer
    - Image Metadata (EXIF)
    - PDF Merge
    - PDF Split & Extract
    - PDF Compressor
    - Images to PDF
    - PDF to Images
    - JSON Formatter
    - Text Case Converter
    - Base64 Encoder/Decoder
    - QR Code Generator
    - CSV <-> JSON
    - XML <-> JSON
    - SQL Formatter
    - cURL Converter
    - Cron Helper
    - Redirect Config Generator
    - Gradient Generator
    - Aspect Ratio Calculator
    - Font Pairing
    - Pomodoro Timer
    - Data Unit Converter
    - Timezone Converter
    - Audio Trimmer
    - Audio Speed & Pitch
    - Audio Joiner
    - Video to GIF
    - File Type Checker
    - File Hash Comparer
    - Site-wide / not tool-specific
  validations:
    required: true
- type: textarea
  id: what-happened
  attributes:
    label: What happened?
    description: A clear description of the bug.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: 1. ... 2. ... 3. ...
  validations:
    required: true
- type: input
  id: expected
  attributes:
    label: What did you expect to happen?
- type: input
  id: env
  attributes:
    label: Browser & device
    placeholder: e.g. Chrome 141 on Android 14 / Safari 18 on iPhone
  validations:
    required: true
- type: textarea
  id: console
  attributes:
    label: Console errors (optional)
    description: Open DevTools -> Console and paste any red errors.
    render: text
- type: checkboxes
  id: confirm
  attributes:
    label: Before submitting
    options:
    - I searched existing issues and this isn't a duplicate
    - I reloaded the page / cleared the site cache and tried again
  validations:
    required: true
