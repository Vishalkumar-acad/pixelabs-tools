name: Performance issue
description: A tool or page is slow, hangs, or uses too much memory.
title: '[Performance]: '
labels:
- performance
body:
- type: dropdown
  id: tool
  attributes:
    label: Which tool is this about?
    options:
    - Image Compressor
    - Image Converter
    - Image Resizer
    - Image Metadata (EXIF)
    - PDF Merge
    - PDF Split & Extract
    - PDF Compressor
    - Images to PDF
    - PDF to Images
    - JSON Formatter
    - Text Case Converter
    - Base64 Encoder/Decoder
    - QR Code Generator
    - CSV <-> JSON
    - XML <-> JSON
    - SQL Formatter
    - cURL Converter
    - Cron Helper
    - Redirect Config Generator
    - Gradient Generator
    - Aspect Ratio Calculator
    - Font Pairing
    - Pomodoro Timer
    - Data Unit Converter
    - Timezone Converter
    - Audio Trimmer
    - Audio Speed & Pitch
    - Audio Joiner
    - Video to GIF
    - File Type Checker
    - File Hash Comparer
    - Site-wide / not tool-specific
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What is slow or hanging?
  validations:
    required: true
- type: input
  id: file-size
  attributes:
    label: Approximate input size (optional)
    placeholder: e.g. a 12 MB JPG, a 60-page PDF
- type: input
  id: env
  attributes:
    label: Browser & device
  validations:
    required: true
- type: textarea
  id: details
  attributes:
    label: How long does it take / when does it happen? (optional)
