name: Documentation / content error
description: Something in the docs, README, or on-page text is wrong or unclear.
title: '[Docs]: '
labels:
- documentation
body:
- type: input
  id: where
  attributes:
    label: Where is it? (README, a page, a tool)
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What's wrong or unclear?
  validations:
    required: true
- type: textarea
  id: suggestion
  attributes:
    label: Suggested fix (optional)
