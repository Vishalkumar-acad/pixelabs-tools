name: Broken link or 404
description: Report a broken link, missing page, or 404.
title: '[Broken link]: '
labels:
- broken-link
body:
- type: input
  id: where
  attributes:
    label: Page where you found the link
  validations:
    required: true
- type: input
  id: link
  attributes:
    label: The broken link (URL)
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What did you expect it to open? (optional)
