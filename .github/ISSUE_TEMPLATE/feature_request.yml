name: Feature request
description: Suggest an improvement to an existing tool or the site.
title: '[Feature]: '
labels:
- enhancement
body:
- type: dropdown
  id: tool
  attributes:
    label: Which tool is this about?
    options:
    - Image Compressor
    - Image Converter
    - Image Resizer
    - Image Metadata (EXIF)
    - PDF Merge
    - PDF Split & Extract
    - PDF Compressor
    - Images to PDF
    - PDF to Images
    - JSON Formatter
    - Text Case Converter
    - Base64 Encoder/Decoder
    - QR Code Generator
    - CSV <-> JSON
    - XML <-> JSON
    - SQL Formatter
    - cURL Converter
    - Cron Helper
    - Redirect Config Generator
    - Gradient Generator
    - Aspect Ratio Calculator
    - Font Pairing
    - Pomodoro Timer
    - Data Unit Converter
    - Timezone Converter
    - Audio Trimmer
    - Audio Speed & Pitch
    - Audio Joiner
    - Video to GIF
    - File Type Checker
    - File Hash Comparer
    - Site-wide / not tool-specific
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What problem would this solve?
  validations:
    required: true
- type: textarea
  id: solution
  attributes:
    label: Describe the solution you'd like
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives you've considered (optional)
- type: textarea
  id: extra
  attributes:
    label: Anything else? (optional)
