name: Cloud / API mode issue
description: A problem with a tool's cloud processing mode (the PixelAbs API).
title: '[Cloud/API]: '
labels:
- cloud-api
body:
- type: markdown
  attributes:
    value: Some tools offer an optional cloud mode powered by the PixelAbs API. Local (in-browser) processing is always the default.
- type: dropdown
  id: tool
  attributes:
    label: Which tool is this about?
    options:
    - Image Compressor
    - Image Converter
    - Image Resizer
    - Image Metadata (EXIF)
    - PDF Merge
    - PDF Split & Extract
    - PDF Compressor
    - Images to PDF
    - PDF to Images
    - JSON Formatter
    - Text Case Converter
    - Base64 Encoder/Decoder
    - QR Code Generator
    - CSV <-> JSON
    - XML <-> JSON
    - SQL Formatter
    - cURL Converter
    - Cron Helper
    - Redirect Config Generator
    - Gradient Generator
    - Aspect Ratio Calculator
    - Font Pairing
    - Pomodoro Timer
    - Data Unit Converter
    - Timezone Converter
    - Audio Trimmer
    - Audio Speed & Pitch
    - Audio Joiner
    - Video to GIF
    - File Type Checker
    - File Hash Comparer
    - Site-wide / not tool-specific
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What did you do, and what happened?
  validations:
    required: true
- type: textarea
  id: error
  attributes:
    label: Any error message or response? (optional)
    render: text
- type: input
  id: env
  attributes:
    label: Browser & device
  validations:
    required: true
